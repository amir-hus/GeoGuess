# GeoGuess on CT 104: /etc/nginx/sites-available/geoguess
# Every request needs a valid gg_session cookie, checked by gg-helper (127.0.0.1:9100).
# Visitors without one are sent to /login.html.

# Real visitor address: Cloudflare's header when coming through the tunnel, else the LAN address
map $http_cf_connecting_ip $gg_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80 default_server;
    root /opt/geoguess/dist;
    index index.html;

    auth_request /__auth;
    error_page 401 = @login;

    location = /__auth {
        internal;
        proxy_pass http://127.0.0.1:9100/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login {
        return 302 /login.html;
    }

    # Login API (rate limited inside gg-helper)
    location = /__login {
        auth_request off;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:9100/login;
        proxy_set_header X-Client-IP $gg_client_ip;
    }
    location = /__login/status {
        auth_request off;
        proxy_pass http://127.0.0.1:9100/status;
        proxy_set_header X-Client-IP $gg_client_ip;
    }

    location = /login.html {
        auth_request off;
        root /var/www/gg-login;
        add_header Cache-Control "no-store";
    }

    # Kill-switch service worker (replaces the build's Workbox SW so cached copies can't skip the login)
    location = /service-worker.js {
        auth_request off;
        root /var/www/gg-login;
        add_header Cache-Control "no-cache";
    }

    # Browsers fetch these without cookies; icons only, nothing sensitive
    location = /manifest.json { auth_request off; }
    location = /favicon.ico   { auth_request off; }
    location /img/icons/      { auth_request off; }
    location /screenshots/    { auth_request off; }

    # Multiplayer database (local Firebase emulator), behind the same login
    include snippets/geoguess-firebase.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }
}
