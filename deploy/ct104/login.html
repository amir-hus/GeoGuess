<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoGuess</title>
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1e1e1e;font-family:sans-serif;color:#eee}
 form{display:flex;flex-direction:column;gap:12px;width:260px}
 input,button{padding:12px;border-radius:6px;border:0;font-size:16px}
 button{background:#468F69;color:#fff;cursor:pointer}
 button:disabled{background:#555;cursor:default}
 #msg{min-height:2.4em;font-size:14px;line-height:1.2em}
 .err{color:#ff6b6b}
</style>
</head>
<body>
<form id="f">
 <h2 style="margin:0">GeoGuess</h2>
 <input id="p" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
 <button id="b">Enter</button>
 <div id="msg"></div>
</form>
<script>
 // Old cookie from the previous password check; no longer used
 document.cookie = 'gg_pass=; path=/; max-age=0';

 var form = document.getElementById('f');
 var input = document.getElementById('p');
 var button = document.getElementById('b');
 var msg = document.getElementById('msg');
 var timer = null;

 function show(text, isError) {
   msg.textContent = text;
   msg.className = isError ? 'err' : '';
 }

 function lock(seconds) {
   clearInterval(timer);
   var until = Date.now() + seconds * 1000;
   input.disabled = button.disabled = true;
   function tick() {
     var left = Math.max(0, Math.ceil((until - Date.now()) / 1000));
     if (left === 0) {
       clearInterval(timer);
       input.disabled = button.disabled = false;
       show('');
       input.focus();
       return;
     }
     var m = Math.floor(left / 60), s = ('0' + (left % 60)).slice(-2);
     show('Too many wrong passwords. Try again in ' + m + ':' + s + '.', true);
   }
   tick();
   timer = setInterval(tick, 1000);
 }

 fetch('/__login/status').then(function (r) { return r.json(); }).then(function (s) {
   if (s.locked) lock(s.retryAfter);
 }).catch(function () {});

 form.onsubmit = function (e) {
   e.preventDefault();
   button.disabled = true;
   fetch('/__login', {
     method: 'POST',
     headers: { 'Content-Type': 'application/json' },
     body: JSON.stringify({ password: input.value })
   }).then(function (r) {
     return r.json().then(function (body) { return { status: r.status, body: body }; });
   }).then(function (res) {
     if (res.status === 200) { location.href = '/'; return; }
     input.value = '';
     button.disabled = false;
     if (res.body.locked) { lock(res.body.retryAfter); return; }
     var n = res.body.attemptsLeft;
     show('Wrong password. ' + n + (n === 1 ? ' try' : ' tries') + ' left.', true);
     input.focus();
   }).catch(function () {
     button.disabled = false;
     show('Could not reach the server. Try again.', true);
   });
 };
</script>
</body>
</html>
